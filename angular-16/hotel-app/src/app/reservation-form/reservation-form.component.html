<app-home></app-home>

<h3 class="mt-5 mb-3">Create a new reservation</h3>

<form [formGroup]="reservationForm" (ngSubmit)="onSubmit()">
    
    <div class="row mb-3">
        <div class="col">
            <label class="form-label">Check-In Date:</label>
            <input class="form-control" type="date" formControlName="checkInDate" />
            <div *ngIf="reservationForm.get('checkInDate')?.invalid && reservationForm.get('checkInDate')?.touched">
                <small class="text-dander" *ngIf="reservationForm.get('checkInDate')?.errors?.['required']">Check-In Date is required.</small>
            </div>
        </div>

        <div class="col">
            <label class="form-label">Check-Out Date:</label>
            <input class="form-control" type="date" formControlName="checkOutDate" />
            <div *ngIf="reservationForm.get('checkOutDate')?.invalid && reservationForm.get('checkOutDate')?.touched">
                <small class="text-danger" *ngIf="reservationForm.get('checkOutDate')?.errors?.['required']">Check-Out Date is required.</small>
            </div>
        </div>
    </div>
    
    <div class="row mb-3">
        <div class="col">
            <label class="form-label">Guest Name:</label>
            <input class="form-control" type="text" formControlName="guestName" />
            <div *ngIf="reservationForm.get('guestName')?.invalid && reservationForm.get('guestName')?.touched">
                <small class="text-danger" *ngIf="reservationForm.get('guestName')?.errors?.['required']">Guest Name is required.</small>
            </div>
        </div>
        
        <div class="col">
            <label class="form-label">Guest Email:</label>
            <input class="form-control" type="email" formControlName="guestEmail" />
            <div *ngIf="reservationForm.get('guestEmail')?.invalid && reservationForm.get('guestEmail')?.touched">
                <small class="text-danger" *ngIf="reservationForm.get('guestEmail')?.errors?.['required']">Guest Email is required.</small>
                <small class="text-danger" *ngIf="reservationForm.get('guestEmail')?.errors?.['email']">Invalid email format.</small>
            </div>
        </div>
    </div>
    
    <div class="row mb-3">
        <div class="col-3">
            <label class="form-label">Room Number:</label>
            <input class="form-control" type="number" formControlName="roomNumber" />
            <div *ngIf="reservationForm.get('roomNumber')?.invalid && reservationForm.get('roomNumber')?.touched">
                <small class="text-danger" *ngIf="reservationForm.get('roomNumber')?.errors?.['required']">Room Number is required.</small>
            </div>
        </div>
    </div>

    <button class="btn btn-primary" type="submit" [disabled]="reservationForm.invalid">Submit</button>
</form>
