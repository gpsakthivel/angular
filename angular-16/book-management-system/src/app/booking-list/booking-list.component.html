<div class="container">

    <div class="card mt-3">

        <div class="row">
            <div class="col">
                <h2 class="text-center">Create New Booking</h2>
            </div>
        </div>

        <div class="row mt-3">
            <div class="col-md-6">
                <input class="form-control" [(ngModel)]="newBookingTitle" placeholder="Booking description">
            </div>
            <div class="col-md-4">
                <input class="form-control" [(ngModel)]="newBookingDate" type="date" placeholder="Booking date">
            </div>
            <div class="col-md-2">
                <button class="btn btn-primary w-100" (click)="addBooking()">Add</button>
            </div>
        </div>

        <h2 class="text-center mt-5">Bookings</h2>

        <ul class="list-group mt-3">
            <li class="list-group-item d-flex justify-content-between align-items-center" *ngFor="let booking of bookings; index as i">
                {{ booking.id }} {{ booking.title }} {{ booking.date | date:'dd.MM.yyyy' }}
                <button class="btn btn-danger" (click)="deleteBooking(i)">Delete</button>
            </li>
        </ul>

    </div>

</div>
